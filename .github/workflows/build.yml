name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Build PMPatch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout AndroidVMTools
        uses: actions/checkout@v4
        with:
          repository: vova7878/AndroidVMTools
          ref: 335b118dbb32a15117500c5f4ced1666ad20258f
          path: external/AndroidVMTools

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build release variant
        run: |
          chmod +x ./gradlew
          ./gradlew :module:assemblePatch3Release

      - name: Collect modules
        run: |
          mkdir -p artifacts
          find module/build -type f -name "*.zip" -print -exec cp {} artifacts/ \;
          if [ -z "$(find artifacts -type f -name '*.zip' -print -quit)" ]; then
            echo "No module zip files were produced. Build outputs:"
            find module/build -maxdepth 5 -type f | sort
            exit 1
          fi
          ls -lah artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PMPatch-PM
          path: artifacts/*
