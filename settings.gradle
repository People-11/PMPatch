pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url 'https://jitpack.io' }
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

def androidVmToolsDir = file('external/AndroidVMTools')
if (androidVmToolsDir.exists()) {
    includeBuild(androidVmToolsDir) {
        dependencySubstitution {
            substitute module('com.github.vova7878:AndroidVMTools') using project(':')
        }
    }
}

rootProject.name = "PMPatch"
include ':module'
